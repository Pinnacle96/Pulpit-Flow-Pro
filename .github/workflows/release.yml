name: Build Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fakeroot

      - name: Build UI
        run: npm run build

      - name: Build Electron (Windows - NSIS)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish never

      - name: Build Electron (macOS - DMG)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --publish never

      - name: Build Electron (Linux - DEB)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux deb --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulpit-flow-pro-${{ runner.os }}
          path: |
            release/*Setup*.exe
            release/*.dmg
            release/*.deb
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*Setup*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
